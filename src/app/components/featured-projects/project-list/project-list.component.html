<div class="project-list">
    @for (entry of projectData; track entry.id; let i = $index) {
        <div class="project-entry" (click)="dialog.show()">
            <span class="title font-firacode">{{entry.title}}</span>
            <span class="tech font-karla">
                @for (tech of entry.tech; track $index) {
                    {{tech}}
                    @if ($index < entry.tech.length - 1) {
                        |
                    }
                }
            </span>
            <img src="{{entry.imgPath}}" alt="">
        </div>

        <dialog #dialog>
            <div class="content">
                <button (click)="dialog.close()">SCHLIEßEN</button>

                @if (newEntry != entry) {
                    <app-project-details [project]="entry">
                    </app-project-details>
                } @else {
                    <app-project-details [project]="newEntry">
                    </app-project-details>
                    
                }
                <button id="next-entry-btn" (click)="newEntry = nextEntry(i)">Next entryyyyyyyyyyyy</button>
            </div>
            <div class="bg" (click)="dialog.close()">
            </div>
        </dialog>
    }

</div>
